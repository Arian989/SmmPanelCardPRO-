<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AuraVoice • Real-Time P2P Group Voice Lounge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS WebRTC Cloud Signaling SDK -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            obsidian: {
              950: '#090A0F',
              900: '#0E1017',
              850: '#12151E',
              800: '#181C28',
              700: '#23293A',
            },
          },
          animation: {
            'blob-slow': 'blob 18s infinite alternate ease-in-out',
            'blob-reverse': 'blobReverse 22s infinite alternate ease-in-out',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '50%': { transform: 'translate(35px, -25px) scale(1.08)' },
              '100%': { transform: 'translate(-20px, 20px) scale(0.95)' },
            },
            blobReverse: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '50%': { transform: 'translate(-30px, 30px) scale(1.06)' },
              '100%': { transform: 'translate(25px, -20px) scale(0.96)' },
            },
          },
        },
      },
    };
  </script>

  <style>
    /* Dynamic Viewport Height for Mobile Browsers */
    html, body {
      height: 100dvh;
      background-color: #090A0F;
      color: #F3F4F6;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Realistic 3D Tactile Hardware Buttons */
    .tactile-btn {
      position: relative;
      background: linear-gradient(180deg, #242938 0%, #161A24 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 6px 14px -2px rgba(0, 0, 0, 0.72),
        0 2px 4px -1px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.18),
        inset 0 -2px 3px rgba(0, 0, 0, 0.5);
      transition:
        transform 0.13s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.13s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .tactile-btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #2B3143 0%, #1B202C 100%);
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow:
        0 8px 18px -2px rgba(0, 0, 0, 0.78),
        0 3px 6px -1px rgba(0, 0, 0, 0.6),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.24),
        inset 0 -2px 3px rgba(0, 0, 0, 0.55);
    }

    .tactile-btn:active:not(:disabled),
    .tactile-btn.pressed {
      transform: translateY(2.5px) scale(0.975);
      box-shadow:
        0 2px 5px -1px rgba(0, 0, 0, 0.75),
        inset 0 2px 5px rgba(0, 0, 0, 0.7),
        inset 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .tactile-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Tactile Color Variants */
    .tactile-emerald {
      background: linear-gradient(180deg, #10B981 0%, #059669 100%);
      border-color: rgba(167, 243, 208, 0.42);
      box-shadow:
        0 6px 18px -2px rgba(16, 185, 129, 0.44),
        0 2px 5px rgba(0, 0, 0, 0.6),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.48),
        inset 0 -2px 4px rgba(4, 120, 87, 0.75);
    }
    .tactile-emerald:hover:not(:disabled) {
      background: linear-gradient(180deg, #14C98D 0%, #06A573 100%);
    }

    .tactile-coral {
      background: linear-gradient(180deg, #F43F5E 0%, #BE123C 100%);
      border-color: rgba(254, 205, 211, 0.38);
      box-shadow:
        0 6px 18px -2px rgba(244, 63, 94, 0.44),
        0 2px 5px rgba(0, 0, 0, 0.65),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.42),
        inset 0 -2px 4px rgba(136, 19, 55, 0.78);
    }
    .tactile-coral:hover:not(:disabled) {
      background: linear-gradient(180deg, #FB506D 0%, #CE1745 100%);
    }

    .tactile-amber {
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      border-color: rgba(253, 230, 138, 0.42);
      box-shadow:
        0 6px 18px -2px rgba(245, 158, 11, 0.4),
        0 2px 5px rgba(0, 0, 0, 0.6),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.45),
        inset 0 -2px 4px rgba(146, 64, 14, 0.75);
    }

    .tactile-indigo {
      background: linear-gradient(180deg, #6366F1 0%, #4338CA 100%);
      border-color: rgba(199, 210, 254, 0.38);
      box-shadow:
        0 6px 18px -2px rgba(99, 102, 241, 0.42),
        0 2px 5px rgba(0, 0, 0, 0.6),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.42),
        inset 0 -2px 4px rgba(49, 46, 129, 0.78);
    }

    /* LED Status Dot */
    .led-dot {
      box-shadow: 0 0 8px currentColor;
    }

    /* Glassmorphic Card Surface */
    .glass-surface {
      background: rgba(18, 21, 30, 0.74);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.085);
      box-shadow:
        0 16px 38px -8px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
    }

    /* Active Speaker Card Aura */
    .speaker-card {
      transition:
        transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.25s ease,
        box-shadow 0.3s ease,
        background 0.25s ease;
    }

    .speaker-card.is-speaking {
      border-color: rgba(16, 185, 129, 0.6);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.11) 0%, rgba(18, 21, 30, 0.88) 100%);
      box-shadow:
        0 18px 42px -10px rgba(16, 185, 129, 0.28),
        0 0 0 1px rgba(16, 185, 129, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      transform: translateY(-3px);
    }

    /* Concentric Speaking Ripples */
    @keyframes ripplePulse {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.68);
        opacity: 0;
      }
    }

    .voice-ripple {
      animation: ripplePulse 1.55s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .voice-ripple-delay {
      animation: ripplePulse 1.55s cubic-bezier(0.16, 1, 0.3, 1) 0.52s infinite;
    }

    /* Floating Emoji Physics */
    @keyframes floatReaction {
      0% {
        transform: translateY(0) translateX(0) scale(0.4) rotate(-8deg);
        opacity: 0;
      }
      15% {
        transform: translateY(-45px) translateX(var(--sway-a, 12px)) scale(1.18) rotate(6deg);
        opacity: 1;
      }
      50% {
        transform: translateY(-190px) translateX(var(--sway-b, -16px)) scale(1.06) rotate(-5deg);
        opacity: 0.95;
      }
      100% {
        transform: translateY(-390px) translateX(var(--sway-c, 18px)) scale(0.85) rotate(10deg);
        opacity: 0;
      }
    }

    .floating-emoji {
      position: fixed;
      pointer-events: none;
      z-index: 60;
      font-size: 2.2rem;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.55));
      animation: floatReaction 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes handWave {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(-14deg) translateY(-2px); }
      75% { transform: rotate(14deg) translateY(-2px); }
    }
    .hand-bounce {
      animation: handWave 1.4s ease-in-out infinite;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body class="flex flex-col justify-between relative selection:bg-emerald-500/30 selection:text-emerald-200">

  <!-- Ambient Background Mesh Orbs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-32 -left-24 w-96 h-96 bg-emerald-500/12 rounded-full blur-[125px] animate-blob-slow"></div>
    <div class="absolute top-1/3 -right-24 w-[28rem] h-[28rem] bg-indigo-500/12 rounded-full blur-[135px] animate-blob-reverse"></div>
    <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-cyan-500/10 rounded-full blur-[125px] animate-blob-slow"></div>
    <div class="absolute inset-0 bg-[radial-gradient(rgba(255,255,255,0.03)_1px,transparent_1px)] [background-size:24px_24px]"></div>
  </div>

  <!-- Hidden Container for Remote WebRTC Audio Streams -->
  <div id="remoteAudioContainer" class="hidden"></div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-full max-w-sm px-4"></div>

  <!-- Floating Reactions Layer -->
  <div id="reactionsLayer" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

  <!-- ===================================================================== -->
  <!-- VIEW 1: PREMIUM OBSIDIAN GLASSMORPHISM LOBBY SCREEN                   -->
  <!-- ===================================================================== -->
  <section id="lobbyScreen" class="relative z-20 flex-1 flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
    <div class="glass-surface rounded-[32px] max-w-md w-full p-6 sm:p-8 border border-white/10 shadow-[0_24px_60px_rgba(0,0,0,0.85)]">
      
      <!-- Brand Header -->
      <div class="flex flex-col items-center text-center mb-7">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-400/20 to-indigo-500/20 border border-emerald-400/30 flex items-center justify-center shadow-inner mb-4">
          <svg class="w-7 h-7 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">AuraVoice Studio</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">Real-Time Peer-to-Peer Encrypted Group Voice</p>
      </div>

      <!-- Permission / Connection Error Banner -->
      <div id="lobbyErrorBanner" class="hidden mb-5 rounded-2xl p-3.5 bg-rose-500/15 border border-rose-500/35 text-rose-200 text-xs leading-relaxed">
        <div class="flex items-start gap-2.5">
          <svg class="w-4 h-4 text-rose-400 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="lobbyErrorText">Microphone permission is required to join a voice call.</span>
        </div>
      </div>

      <!-- Step 1: Display Name Input -->
      <div class="mb-5">
        <label for="displayNameInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
          Your Display Name
        </label>
        <input
          id="displayNameInput"
          type="text"
          maxlength="22"
          placeholder="e.g. Siam, Rafi, Nadia..."
          class="w-full bg-obsidian-950/90 border border-white/10 rounded-2xl px-4 py-3.5 text-sm sm:text-base text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500/60 focus:ring-2 focus:ring-emerald-500/20 transition"
        />
      </div>

      <!-- Primary Action: Create New Room -->
      <button
        id="createRoomBtn"
        onclick="startRoomFlow('host')"
        class="tactile-btn tactile-emerald w-full py-3.5 px-5 rounded-2xl text-sm sm:text-base font-semibold text-white flex items-center justify-center gap-2.5 cursor-pointer"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 5v14M5 12h14" stroke-linecap="round" />
        </svg>
        <span id="createBtnText">Create New Voice Room</span>
      </button>

      <!-- Divider -->
      <div class="relative my-6 flex items-center justify-center">
        <div class="w-full border-t border-white/10"></div>
        <span class="px-3 bg-obsidian-850 text-[11px] font-semibold uppercase tracking-widest text-slate-500 rounded-full">
          Or Join With Code
        </span>
      </div>

      <!-- Join Existing Room by Code -->
      <div class="flex items-stretch gap-2.5">
        <input
          id="roomCodeInput"
          type="text"
          maxlength="8"
          placeholder="ROOM CODE"
          oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')"
          class="w-36 sm:w-40 bg-obsidian-950/90 border border-white/10 rounded-2xl px-3.5 py-3.5 text-center font-mono text-sm sm:text-base font-bold tracking-widest text-emerald-300 placeholder-slate-600 uppercase focus:outline-none focus:border-indigo-500/60 transition"
        />
        <button
          id="joinRoomBtn"
          onclick="startRoomFlow('guest')"
          class="tactile-btn tactile-indigo flex-1 py-3.5 px-4 rounded-2xl text-sm sm:text-base font-semibold text-white flex items-center justify-center gap-2 cursor-pointer"
        >
          <span id="joinBtnText">Join Room</span>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <!-- Info Footer -->
      <div class="mt-6 pt-4 border-t border-white/5 flex items-center justify-between text-[11px] text-slate-500">
        <span class="inline-flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 led-dot"></span>
          WebRTC Mesh Audio
        </span>
        <span>Zero Server Storage</span>
      </div>
    </div>
  </section>

  <!-- ===================================================================== -->
  <!-- VIEW 2: ACTIVE GROUP VOICE CALL ROOM                                  -->
  <!-- ===================================================================== -->
  <div id="callScreen" class="hidden flex-col justify-between h-full w-full relative z-10">
    
    <!-- TOP ROOM HEADER -->
    <header class="relative z-20 px-3 sm:px-6 pt-3 sm:pt-4 pb-2 shrink-0">
      <div class="max-w-7xl mx-auto glass-surface rounded-2xl px-3.5 py-2.5 sm:px-5 sm:py-3.5 flex items-center justify-between gap-2.5">
        
        <!-- Left: Room Code Pill & Live Timer -->
        <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
          <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-emerald-400/20 to-indigo-500/20 border border-white/10 flex items-center justify-center shadow-inner shrink-0">
            <svg class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4" />
            </svg>
          </div>

          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <button onclick="copyRoomCode()" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition cursor-pointer" title="Tap to copy Room Code">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Room</span>
                <span id="headerRoomCode" class="font-mono text-xs sm:text-sm font-bold text-emerald-400 tracking-wider">-----</span>
              </button>
              <span id="connectionStatusBadge" class="hidden sm:inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                P2P Live
              </span>
            </div>
            <div class="flex items-center gap-2 text-xs text-slate-400 mt-0.5">
              <span class="inline-flex items-center gap-1.5 font-mono text-emerald-400/90">
                <span class="w-2 h-2 rounded-full bg-emerald-400 led-dot animate-pulse"></span>
                <span id="callTimer">00:00</span>
              </span>
              <span>•</span>
              <span id="participantCountLabel">1 in room</span>
            </div>
          </div>
        </div>

        <!-- Right: SFX Toggle, One-Tap Share Link & Chat Drawer Toggle -->
        <div class="flex items-center gap-2">
          <!-- Tactile UI Click Sounds Toggle -->
          <button id="uiSfxBtn" onclick="toggleUiSfx()" class="tactile-btn p-2.5 rounded-xl text-slate-300 hover:text-white cursor-pointer" title="Toggle Tactile Click Sounds">
            <svg id="uiSfxIconOn" class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="uiSfxIconOff" class="w-4 h-4 text-slate-500 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <!-- One-Tap Copy Shareable Invite Link -->
          <button onclick="copyInviteLink()" class="tactile-btn tactile-indigo px-3 py-2 rounded-xl text-xs font-semibold text-white flex items-center gap-1.5 cursor-pointer" title="Copy Shareable Link for Friends">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span>Share Link</span>
          </button>

          <!-- Chat Drawer Toggle -->
          <button id="drawerToggleBtn" onclick="toggleSideDrawer()" class="tactile-btn px-3 py-2 rounded-xl text-xs font-medium text-slate-200 flex items-center gap-1.5 cursor-pointer relative">
            <svg class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span class="hidden sm:inline">Chat</span>
            <span id="chatUnreadBadge" class="hidden w-2.5 h-2.5 rounded-full bg-rose-500 led-dot"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN STAGE: PARTICIPANTS GRID + REAL-TIME CHAT DRAWER -->
    <main class="relative z-10 flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-2 sm:py-4 flex flex-col lg:flex-row gap-4 overflow-y-auto">
      
      <!-- Active Voice Stage -->
      <section class="flex-1 flex flex-col justify-center">
        
        <!-- Raised Hands Queue Banner -->
        <div id="raisedHandsBanner" class="hidden mb-3 glass-surface rounded-2xl px-4 py-2.5 border-amber-500/35 flex items-center justify-between gap-3">
          <div class="flex items-center gap-2 text-xs sm:text-sm min-w-0">
            <span class="text-base hand-bounce">✋</span>
            <span class="text-amber-300 font-semibold shrink-0">Hand Raised:</span>
            <span id="r
